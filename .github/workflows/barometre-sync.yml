name: Barometre - automatically synchronize published snapshots

on:
  schedule:
    # Daily safety net if an immediate app-triggered synchronization could not start.
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: barometre-static-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate public Barometre snapshots
        env:
          SCOREIMMO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SCOREIMMO_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run barometre:sync

      - name: Install Chromium for browser behavior tests
        run: npx playwright install --with-deps chromium

      - name: Run behavioral and editorial tests
        run: |
          npm test
          npm run test:content-truth

      - name: Build and validate generated routes
        run: |
          npm run build
          npm run test:site-integrity

      - name: Detect a public snapshot change
        id: changes
        run: |
          removed_count="$(git diff --name-only --diff-filter=D -- src/content/barometre | wc -l | tr -d ' ')"
          echo "removed_count=$removed_count" >> "$GITHUB_OUTPUT"
          echo "Barometre snapshot removals: $removed_count" >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- . ':(exclude)src/content/barometre/**'
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)src/content/barometre/**')" ]; then
            echo "Unexpected generated changes outside src/content/barometre" >&2
            git status --short -- . ':(exclude)src/content/barometre/**' >&2
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all -- src/content/barometre)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the verified snapshots on main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "score-immo-barometre-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/barometre
          git commit -m "chore(barometre): synchronize published snapshots"
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main

      - name: Verify live deployed parity when no synchronization is pending
        if: steps.changes.outputs.changed == 'false'
        env:
          SCOREIMMO_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SCOREIMMO_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run barometre:verify-live
