name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - 'functions/**'
  workflow_run:
    # Trigger deploy after blog-auto commit (bot commits don't fire `on: push`)
    workflows: ["Blog Auto - publish next article"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    # Skip if triggered by failed workflow_run
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_ANON: ${{ secrets.PUBLIC_SUPABASE_ANON }}

      - name: Validate generated routes
        run: npm run test:site-integrity

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=score-immo --branch=main

      - name: Collect changed files for IndexNow
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > "$RUNNER_TEMP/indexnow-changed-files.txt"

      - name: Notify IndexNow after deployment
        continue-on-error: true
        env:
          CHANGED_FILE_LIST: ${{ runner.temp }}/indexnow-changed-files.txt
        run: |
          if [ -f "$CHANGED_FILE_LIST" ]; then
            python3 scripts/indexnow_ping.py --changed-file-list "$CHANGED_FILE_LIST"
          else
            python3 scripts/indexnow_ping.py
          fi
