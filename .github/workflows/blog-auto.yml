name: Blog Auto - publish prepared or queue next article

# Priorité 1 : promouvoir un article finalisé et scellé arrivé à échéance.
# Priorité 2 : sélectionner le prochain sujet éditorial échu et écrire une spec queue.
# Ce workflow n'appelle pas l'API Anthropic.

on:
  schedule:
    # Lun-Ven, 06:00-09:00 UTC (08h-11h Paris CEST été, 07h-10h hiver)
    # Random via multiple windows pour eviter heure pile (regle STACK-2026)
    - cron: '17 6 * * 1-5'
    - cron: '43 7 * * 1-5'
    - cron: '29 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force next unpublished article (bypass schedule)'
        required: false
        default: 'false'

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  queue:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Queue next article (no API call)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 blog-auto/publish.py --force
          else
            python3 blog-auto/publish.py
          fi
